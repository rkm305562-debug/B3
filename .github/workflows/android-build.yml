name: Build Android APK (ZainQH Chat)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Ensure Valid Gradle Wrapper & Grant Permissions
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing from the repo. Refusing to silently" \
                 "regenerate it with whatever Gradle happens to be preinstalled on the runner" \
                 "(that previously overwrote the pinned Gradle version and broke the build" \
                 "with a Kotlin/Compose compiler mismatch). Commit a real gradle-wrapper.jar" \
                 "generated via 'gradle wrapper --gradle-version <pinned-version>' instead."
            exit 1
          fi
          chmod +x gradlew

      - name: Restore or Generate Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fallback debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring REAL release keystore from RELEASE_KEYSTORE_BASE64 secret..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret configured — the 'release' build" \
                 "below will be signed with the DEBUG certificate as a placeholder so CI can" \
                 "still validate the build. DO NOT upload this artifact to Google Play; it is" \
                 "not a real release signature. Add the RELEASE_KEYSTORE_BASE64 /" \
                 "RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD repository secrets to enable" \
                 "real signing (see docs/SIGNING.md)."
            cp debug.keystore my-upload-key.jks
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZainQH-Chat-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Build Release AAB (for Google Play Console upload)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
        continue-on-error: true

      - name: Upload Release APK Artifact (If present)
        uses: actions/upload-artifact@v4
        with:
          name: ZainQH-Chat-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Release AAB Artifact (If present)
        uses: actions/upload-artifact@v4
        with:
          name: ZainQH-Chat-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: ignore
